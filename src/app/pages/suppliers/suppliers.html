<div class="flex flex-col justify-center m-6">
  <h2 class="text-2xl font-bold mb-4">Gestión de Proveedores</h2>
  <p-toolbar class="mb-6 w-full">
    <ng-template #start>
      <p-button
        size="small"
        label="Nuevo Proveedor"
        icon="pi pi-plus"
        class="mr-2"
        (onClick)="createNewSupplier()"
      />
    </ng-template>
  </p-toolbar>
  <crud-table
    [items]="suppliers"
    [columns]="columns"
    [actions]="actions"
    (edit)="editSupplier($event)"
    (delete)="deleteSupplier($event)"
    [internalId]="keyInternalId"
  ></crud-table>
  <p-dialog
    [(visible)]="supplierDialog"
    [style]="{ width: '550px' }"
    header="Detalles del Proveedor"
    [modal]="true"
  >
    <crud-form
      [form]="supplierForm"
      [fields]="formFields"
      (save)="saveSupplier()"
      (cancel)="hideDialog()"
    >
    </crud-form>
    <ng-template #footer></ng-template>
  </p-dialog>
</div>
<app-message-toast #toast></app-message-toast>
