<div class="flex flex-col md:flex-row justify-center h-screen items-center">
  <p-card class="w-80">
    <form [formGroup]="loginForm">
      <div class="laser-container">
        <div class="laser">
          <span>LASER</span>
          <span class="laser-color">COLOR</span>
          <span class="laser-veloz">VELOZ</span>
        </div>
      </div>
      <h1 class="flex text-xl justify-center mt-2 mb-4">Inicio de Sesión</h1>
      <div class="flex flex-col items-center justify-center gap-3">
        <div class="flex flex-col gap-2 w-full">
          <p-iftalabel>
            <input
              formControlName="email"
              pInputText
              id="email"
              type="email"
              autocomplete="off"
              class="w-full"
            />
            <label for="email">Email</label>
          </p-iftalabel>
        </div>
        <div class="flex flex-col gap-2 w-full">
          <p-ifta-label>
            <input
              formControlName="password"
              pInputText
              id="password"
              type="password"
              autocomplete="off"
              class="w-full"
            />
            <label for="password">Contraseña</label>
          </p-ifta-label>
        </div>
        <div class="flex flex-col gap-2 w-full">
          <p-select
            [options]="groupedGalleries"
            placeholder="Selecciona el Stand"
            [group]="true"
            class="w-full"
            formControlName="standId"
          >
            <ng-template let-group #group>
              <div class="flex items-center">
                <span>{{ group.label }}</span>
              </div>
            </ng-template>
          </p-select>
        </div>
        <div class="flex flex-col gap-2 w-full">
          <p-button label="Ingresar" icon="pi pi-user" (click)="loginUser()" styleClass="w-full" />
        </div>
      </div>
    </form>
  </p-card>
</div>
